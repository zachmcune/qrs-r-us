<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My QR codes — QR's R Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-dashboard">
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand__mark">QR</span>
      <span class="brand__name">QR's R Us</span>
    </a>
    <nav id="auth-status" class="auth-status"></nav>
  </header>

  <main class="dashboard">
    <div class="dashboard__header">
      <div>
        <h1>My QR codes</h1>
        <p class="lede" style="margin:0">Edit, download, or delete your saved designs.</p>
      </div>
      <a href="index.html" class="btn btn--primary">+ New QR code</a>
    </div>

    <div id="empty-state" class="empty-state-page" hidden>
      <p>No QR codes yet — let's make your first one.</p>
      <a href="index.html" class="btn btn--primary">Create QR code</a>
    </div>

    <div id="qr-list" class="qr-list"></div>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
