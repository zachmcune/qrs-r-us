<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — QR's R Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth" data-mode="login">
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand__mark">QR</span>
      <span class="brand__name">QR's R Us</span>
    </a>
  </header>

  <main class="auth-page">
    <section class="panel panel--narrow">
      <h1>Welcome back</h1>
      <p class="lede">Sign in to access your saved QR codes.</p>
      <form id="auth-form" class="form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Sign in</button>
      </form>
      <p class="auth-switch">No account? <a href="signup.html">Create one</a></p>
      <p id="message" class="message message--error" hidden></p>
    </section>
  </main>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
